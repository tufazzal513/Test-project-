name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore and .env
        run: |
          echo "=== Setting up Build Environment ==="
          # Generate debug.keystore if missing
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "Generated debug.keystore"
          fi

          # Ensure .env exists so secrets plugin does not fail
          if [ ! -f ".env" ]; then
            touch .env
            echo "Created empty .env"
          fi

      - name: Build Debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and copy APK
        id: find_apk
        run: |
          echo "=== Locating Built APK ==="
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

          echo "Found APK at: $APK_FILE"
          mkdir -p build-output
          cp "$APK_FILE" build-output/calculator-debug.apk
          echo "apk_path=build-output/calculator-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-app-apk
          path: build-output/calculator-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Calculator App Build #${{ github.run_number }}"
          
          gh release create "$TAG_NAME" \
            build-output/calculator-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes "Automated build of Calculator App. Download **calculator-debug.apk** directly to install on your Android device." \
            --latest || echo "Release creation skipped or already exists."

